<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: rgb(151, 71, 221);
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            color: yellow;
            font-size: 1.5rem;
            text-align: center;
            margin: 30px 0;
        }

        .main {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .bhjns {
            width: 65%;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .radhe-photos {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            justify-content: center;
        }

        .radhe-photos img {
            width: 48%;
            border-radius: 12px;
            height: 200px;
            object-fit: cover;
        }

        .bhajan-card {
            background: rgb(244, 244, 189);
            color: rgb(79, 0, 128);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            width: 300px;
            cursor: pointer;
            transition: 0.3s;
        }

        .bhajan-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
            background: rgb(236, 236, 133);
        }

        a {
            text-decoration: none;
        }

        @media (max-width: 768px) {

            .main {
                flex-direction: column;
            }

            .bhjns,
            .radhe-photos {
                width: 100%;
            }

            .radhe-photos img {
                width: 100%;
                height: 400px;
            }

            .bhajan-card {
                width: 100%;
            }
        }
    </style>
</head>
